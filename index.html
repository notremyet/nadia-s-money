<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nadia's money</title>
<meta name="theme-color" content="#db2777">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="nadia's money">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#fff7fa; --card:#ffffff; --text:#14181f; --muted:#6b7280; --line:#e6e8ec;
  --brand:#db2777; --brand-soft:#fdeef5; --exp:#dc2626; --inc:#059669; --warn:#d97706;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#140d11; --card:#1f151b; --text:#eef0f3; --muted:#9aa3af; --line:#262c36;
    --brand:#f472b6; --brand-soft:#3a1628; --exp:#f87171; --inc:#34d399; --warn:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.top h1{font-size:20px;margin:0}
.mnav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.mnav button{width:32px;height:32px;border-radius:50%;font-size:18px}
.mnav button:active{background:var(--line)}
.mnav span{min-width:96px;text-align:center;font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#f472b6,#db2777 55%,#be185d);color:#fff}
.hero .lbl{opacity:.8;font-size:13px}
.hero .big{font-size:32px;font-weight:700;margin:2px 0 12px;letter-spacing:-.5px}
.hero .row{display:flex;gap:10px}
.hero .row>div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.hero .row b{display:block;font-size:16px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.hero .bar{background:rgba(255,255,255,.2)}.hero .bar>i{background:#fff}
.small{font-size:13px;color:var(--muted)} .hero .small{color:rgba(255,255,255,.85)}
.today{display:flex;justify-content:space-between;align-items:center}
.today b{font-size:20px}
.day{margin:16px 4px 6px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--bg)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:20px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid div{font-weight:600}
.item .mid small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.exp{color:var(--exp)} .inc{color:var(--inc)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty div{font-size:40px;margin-bottom:8px}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:4px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:4px 0;gap:2px}
nav.tabs button span{font-size:20px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs button.on span{filter:none;opacity:1}
.fab{width:58px!important;height:58px;flex:none!important;border-radius:50%;background:var(--brand)!important;color:#fff!important;
  font-size:30px!important;box-shadow:0 6px 18px rgba(219,39,119,.4);margin-top:-26px;justify-content:center}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.mask.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--text)}
.seg button.on.e{color:var(--exp)} .seg button.on.i{color:var(--inc)}
.amtin{width:100%;font-size:36px;font-weight:700;text-align:center;border:0;background:transparent;padding:6px 0;outline:none}
.amtin::placeholder{color:var(--line)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:-4px 0 10px;min-height:16px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:2px solid transparent;font-size:12px}
.cat span{font-size:24px}
.cat.on{border-color:var(--brand);background:var(--brand-soft)}
.field{display:flex;gap:8px;margin-bottom:10px}
.field input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:17px}
.btn.ghost{background:var(--bg);color:var(--text);font-weight:600;font-size:15px}
.btn.danger{background:transparent;color:var(--exp);font-weight:600;font-size:15px}
.btns{display:flex;gap:8px;margin-top:8px}
/* summary */
.donut{display:flex;gap:16px;align-items:center}
.donut svg{flex:none}
.legend{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.crow:last-child{border-bottom:0}
.crow .mid{flex:1;min-width:0}
.crow .mid .bar{margin-top:6px;height:6px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat3>div{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat3 b{display:block;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{font-size:15px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:99px;background:var(--bg);margin:0 6px 8px 0;font-size:14px}
.chip button{width:22px;height:22px;border-radius:50%;background:var(--line);font-size:12px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.set p{margin:0 0 10px}
.sd{font-size:12px;font-weight:600;margin-left:6px;vertical-align:middle;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.sd.err{background:#fee2e2;color:#b91c1c}
.sd:empty{display:none}
.note{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs">
  <button data-tab="home" class="on"><span>🏠</span>หน้าหลัก</button>
  <button data-tab="summary"><span>📊</span>สรุป</button>
  <button class="fab" id="fab" aria-label="เพิ่มรายการ">+</button>
  <button data-tab="subs"><span>🔁</span>บิลประจำ</button>
  <button data-tab="settings"><span>⚙️</span>ตั้งค่า</button>
</nav>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
const KEY = 'money_app_v1';
const COLORS = ['#db2777','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#ec4899','#10b981','#f97316','#06b6d4','#84cc16','#6366f1','#a3a3a3'];
const DEF = {
  tx: [], subs: [], budget: 0, lastBackup: 0, lastCat: {},
  sync: {url:'', key:''}, pending: {}, metaUpdated: 0, metaDirty: false, lastSync: 0,
  cats: {
    expense: [
      ['food','🍜','อาหาร'],['drink','☕','เครื่องดื่ม'],['travel','🚗','เดินทาง'],['grocery','🛒','ของใช้'],
      ['shop','🛍️','ช้อปปิ้ง'],['home','🏠','ที่พัก'],['bill','💡','ค่าน้ำไฟ'],['phone','📱','โทร/เน็ต'],
      ['health','💊','สุขภาพ'],['fun','🎮','บันเทิง'],['edu','📚','การศึกษา'],['other_e','📦','อื่นๆ']
    ].map(([id,icon,name])=>({id,icon,name})),
    income: [
      ['salary','💼','เงินเดือน'],['freelance','💻','งานเสริม'],['bonus','🎉','โบนัส'],
      ['gift','🎁','ได้รับเงิน'],['invest','📈','ลงทุน'],['other_i','💰','อื่นๆ']
    ].map(([id,icon,name])=>({id,icon,name}))
  }
};

/* ---------- storage ---------- */
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.tx)) return Object.assign(JSON.parse(JSON.stringify(DEF)), d);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ บันทึกไม่สำเร็จ'); }
}
function save(){ saveLocal(); queueSync(); }
let S = load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const curMonth = () => todayStr().slice(0,7);
const fmt = n => (Math.round(n*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const baht = n => '฿' + fmt(n);
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel = m => { const [y,mo]=m.split('-'); return new Date(y,mo-1,1).toLocaleDateString('th-TH',{month:'short',year:'2-digit'}); };
const shiftMonth = (m,k) => { const [y,mo]=m.split('-').map(Number); const d=new Date(y,mo-1+k,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const dayLabel = s => {
  if (s===todayStr()) return 'วันนี้';
  const y = new Date(); y.setDate(y.getDate()-1);
  if (s===ymd(y)) return 'เมื่อวาน';
  const [a,b,c]=s.split('-'); return new Date(a,b-1,c).toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
};
const findCat = (type,id) => S.cats[type].find(c=>c.id===id) || {id, icon:'❔', name:'(หมวดที่ลบแล้ว)'};
const visibleCats = type => S.cats[type].filter(c=>!c.hidden);
const inMonth = m => S.tx.filter(t=>t.date.startsWith(m));
const sum = (arr,type) => arr.filter(t=>t.type===type).reduce((a,t)=>a+t.amount,0);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function calc(str){
  const s = String(str).replace(/,/g,'').replace(/[x×]/g,'*').replace(/÷/g,'/').trim();
  if (!s) return NaN;
  if (!/^[\d.+\-*/() ]+$/.test(s)) return NaN;
  try{ const v = Function('"use strict";return ('+s+')')(); return isFinite(v) ? Math.round(v*100)/100 : NaN; }catch(e){ return NaN; }
}

/* ---------- state ---------- */
let tab = 'home', month = curMonth(), sumType = 'expense', catFilter = null, query = '', catTab = 'expense';

function render(){
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  $('#app').innerHTML = ({home:viewHome, summary:viewSummary, cats:viewCats, subs:viewSubs, settings:viewSettings})[tab]();
}
function monthNav(){
  return `<div class="mnav"><button data-act="prev">‹</button><span>${monthLabel(month)}</span><button data-act="next">›</button></div>`;
}
function txRows(list){
  if (!list.length) return '';
  const groups = {};
  list.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.ts-a.ts).forEach(t=>(groups[t.date] ||= []).push(t));
  return Object.entries(groups).map(([d,items])=>{
    const net = sum(items,'income') - sum(items,'expense');
    return `<div class="day"><span>${dayLabel(d)}</span><span class="${net<0?'exp':'inc'}">${net<0?'-':'+'}${fmt(Math.abs(net))}</span></div>
    <div class="list">${items.map(t=>{const c=findCat(t.type,t.cat);return `
      <button class="item" data-edit="${t.id}"><div class="ic">${c.icon}</div>
      <div class="mid"><div>${esc(c.name)}</div>${t.note?`<small>${esc(t.note)}</small>`:''}</div>
      <div class="amt ${t.type==='expense'?'exp':'inc'}">${t.type==='expense'?'-':'+'}${fmt(t.amount)}</div></button>`}).join('')}</div>`;
  }).join('');
}

/* ---------- views ---------- */
function viewHome(){
  const list = inMonth(month);
  const inc = sum(list,'income'), exp = sum(list,'expense');
  const isCur = month === curMonth();
  const todayExp = sum(S.tx.filter(t=>t.date===todayStr()),'expense');
  let budgetHtml = '';
  if (S.budget > 0){
    const pct = Math.min(100, exp/S.budget*100), left = S.budget - exp;
    let perDay = '';
    if (isCur){
      const d = new Date(); const daysLeft = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate() - d.getDate() + 1;
      perDay = left > 0 ? ` · ใช้ได้อีกวันละ ${baht(left/daysLeft)}` : '';
    }
    budgetHtml = `<div style="margin-top:12px"><div class="small" style="display:flex;justify-content:space-between;margin-bottom:6px">
      <span>งบเดือนนี้ ${baht(S.budget)}</span><span>${left>=0?'เหลือ '+baht(left):'เกินงบ '+baht(-left)}</span></div>
      <div class="bar"><i style="width:${pct}%;${left<0?'background:#fecaca':''}"></i></div>
      <div class="small" style="margin-top:6px">ใช้ไป ${Math.round(exp/S.budget*100)}%${perDay}</div></div>`;
  }
  const q = query.trim().toLowerCase();
  const shown = q ? list.filter(t => (t.note||'').toLowerCase().includes(q) || findCat(t.type,t.cat).name.toLowerCase().includes(q) || String(t.amount).includes(q)) : list;
  const needBackup = !syncOn() && S.tx.length >= 10 && Date.now() - (S.lastBackup||0) > 30*864e5;
  return `
  <div class="top"><h1>nadia's money 🎀<span id="sd" class="sd">${syncBadge()}</span></h1>${monthNav()}</div>
  ${needBackup?`<div class="note">💾 ไม่ได้สำรองข้อมูลเกิน 30 วันแล้ว <button data-act="backup" style="color:var(--brand);font-weight:700">สำรองตอนนี้</button></div>`:''}
  <div class="card hero">
    <div class="lbl">คงเหลือเดือนนี้</div>
    <div class="big">${inc-exp<0?'-':''}${baht(Math.abs(inc-exp))}</div>
    <div class="row"><div><span class="small">รายรับ</span><b>+${fmt(inc)}</b></div><div><span class="small">รายจ่าย</span><b>-${fmt(exp)}</b></div></div>
    ${budgetHtml}
  </div>
  ${isCur?subBanner():''}
  ${isCur?`<div class="card today"><div><div class="small">ใช้ไปวันนี้</div><b class="exp">${baht(todayExp)}</b></div>
    <button class="btn" style="width:auto;padding:10px 18px;font-size:15px" data-act="add">+ บันทึก</button></div>`:''}
  ${list.length>5?`<input class="search" id="search" placeholder="🔎 ค้นหาโน้ต / หมวด / จำนวน" value="${esc(query)}">`:''}
  ${shown.length ? txRows(shown) : `<div class="empty"><div>📝</div>${q?'ไม่พบรายการ':'ยังไม่มีรายการในเดือนนี้<br>กดปุ่ม + เพื่อเริ่มบันทึก'}</div>`}`;
}

function donut(data,total){
  const R=54, C=2*Math.PI*R; let off=0;
  const segs = data.map(d=>{ const len=d.v/total*C; const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${d.color}" stroke-width="22"
    stroke-dasharray="${Math.max(len-1.5,0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off+=len; return s; }).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="22"/>${segs}
    <text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--muted)">รวม</text>
    <text x="70" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">${fmt(total)}</text></svg>`;
}
function dailyBars(list){
  const [y,m] = month.split('-').map(Number); const days = new Date(y,m,0).getDate();
  const vals = Array.from({length:days},(_,i)=> sum(list.filter(t=>t.date===`${month}-${pad(i+1)}`),'expense'));
  const max = Math.max(...vals,1), W=100/days;
  const avgDays = month===curMonth()? new Date().getDate() : days;
  const avg = vals.reduce((a,b)=>a+b,0)/avgDays;
  const bars = vals.map((v,i)=>`<rect x="${i*W+W*0.15}%" y="${100-v/max*100}%" width="${W*0.7}%" height="${v/max*100}%" rx="2" fill="${v>avg*1.5?'var(--exp)':'var(--brand)'}" opacity="${v?1:0}"><title>${i+1}: ${fmt(v)}</title></rect>`).join('');
  return `<div class="card"><h3>รายจ่ายรายวัน</h3>
    <svg width="100%" height="110" preserveAspectRatio="none" style="display:block">${bars}</svg>
    <div class="small" style="display:flex;justify-content:space-between;margin-top:6px"><span>1</span><span>เฉลี่ยวันละ ${baht(avg)}</span><span>${days}</span></div></div>`;
}
function viewSummary(){
  const list = inMonth(month), prev = inMonth(shiftMonth(month,-1));
  const inc = sum(list,'income'), exp = sum(list,'expense'), pexp = sum(prev,'expense');
  const diff = pexp ? Math.round((exp-pexp)/pexp*100) : null;
  const byCat = {};
  list.filter(t=>t.type===sumType).forEach(t=> byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const total = Object.values(byCat).reduce((a,b)=>a+b,0);
  const data = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([id,v],i)=>({id,v,color:COLORS[i%COLORS.length],c:findCat(sumType,id)}));
  const filtered = catFilter ? list.filter(t=>t.type===sumType && t.cat===catFilter) : [];
  return `
  <div class="top"><h1>สรุป</h1>${monthNav()}</div>
  <div class="stat3">
    <div><span class="small">รายรับ</span><b class="inc">${fmt(inc)}</b></div>
    <div><span class="small">รายจ่าย</span><b class="exp">${fmt(exp)}</b></div>
    <div><span class="small">คงเหลือ</span><b>${fmt(inc-exp)}</b></div>
  </div>
  ${diff!==null?`<div class="note">${diff>0?'📈':'📉'} รายจ่าย${diff>0?'มากกว่า':'น้อยกว่า'}เดือนก่อน ${Math.abs(diff)}% (${baht(pexp)})</div>`:''}

function syncDraft(){ if(!draft) return; draft.amountStr=$('#amt').value; draft.note=$('#note').value; draft.date=$('#date').value||todayStr(); }
function saveTx(){
  syncDraft();

  if (!draft.cat) { toast('เลือกหมวดก่อนนะ'); return; }
  const rec = {id: draft.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)), type:draft.type, amount, cat:draft.cat, note:draft.note.trim(), date:draft.date, ts: draft.ts || Date.now(), updated: Date.now()};
  markTx(rec.id,'up');
  if (draft.id) S.tx = S.tx.map(t=>t.id===draft.id?rec:t); else S.tx.push(rec);

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function backup(){
  S.lastBackup = Date.now(); save();
  download(`money-backup-${todayStr()}.json`, JSON.stringify(S,null,1), 'application/json');

}
function exportCsv(){
  const rows = [['วันที่','ประเภท','หมวด','จำนวน','โน้ต']].concat(

    case 'add': return openSheet();

    }
    case 'savebudget': {
      const v = calc($('#budget').value); S.budget = v>0 ? v : 0; markMeta(); save(); toast(S.budget?'ตั้งงบแล้ว':'ยกเลิกงบแล้ว'); return;
    }
    case 'addsub': return openSub();
    case 'savesub': return saveSub();
    case 'delsub':
      if (confirm(`ลบ "${subDraft.name}"? (รายการรายจ่ายที่ลงไปแล้วจะยังอยู่)`)){ S.subs=S.subs.filter(s=>s.id!==subDraft.id); markMeta(); save(); closeSheet(); render(); }
      return;
    case 'link': return linkSync();
    case 'unlink':
      if (confirm('ยกเลิกการเชื่อมต่อ? ข้อมูลในเครื่องนี้และใน Google Sheets ยังอยู่ครบ')){ S.sync={url:'',key:''}; S.pending={}; saveLocal(); setSync(); render(); }
      return;
    case 'syncnow': return sync(true);
    case 'backup': return backup();
    case 'restore': return $('#fileIn').click();
    case 'csv': return exportCsv();
    case 'wipe':
      if (confirm('ลบข้อมูลทั้งหมด? (แนะนำให้สำรองก่อน)' + (syncOn()?' ข้อมูลใน Google Sheets จะถูกลบด้วย':'')) && confirm('แน่ใจนะ? กู้คืนไม่ได้')){ const keep=S.sync, ids=S.tx.map(t=>t.id); S=JSON.parse(JSON.stringify(DEF)); S.sync=keep; if(syncOn()){ ids.forEach(id=>markTx(id,'del')); markMeta(); } save(); render(); toast('ล้างข้อมูลแล้ว'); }
      return;
  }
});

/* ---------- sync (Google Sheets) ---------- */
const syncOn = () => !!(S.sync && S.sync.url && S.sync.key);
let syncState = '', syncing = false, syncAgain = false, syncTimer = null;
function markTx(id, op){ if (syncOn()) S.pending[id] = {op, updated: Date.now()}; }
function markMeta(){ S.metaUpdated = Date.now(); if (syncOn()) S.metaDirty = true; }
function markAll(){ const now = Date.now(); S.tx.forEach(t=>{ t.updated = t.updated || now; S.pending[t.id] = {op:'up', updated: now}; }); S.metaDirty = true; S.metaUpdated = S.metaUpdated || now; }
function syncBadge(){
  if (!syncOn()) return '';
  return ({busy:'⏳', ok:'☁️✓', err:'⚠️ ซิงค์ไม่ได้', offline:'📴 ออฟไลน์'})[syncState] || '☁️';
}
function setSync(st){ if (st!==undefined) syncState = st; const el = $('#sd'); if (el){ el.textContent = syncBadge(); el.classList.toggle('err', st==='err'); } }
function queueSync(){ if (!syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 800); }
function fixCat(t){
  const list = S.cats[t.type] || [];
  if (t.cat && list.some(c=>c.id===t.cat)) return t;
  const byName = t.catName && list.find(c=>c.name===t.catName);
  t.cat = byName ? byName.id : (t.type==='income' ? 'other_i' : 'other_e');
  return t;
}
async function sync(manual){
  if (!syncOn()) return;
  if (syncing){ syncAgain = true; return; }
  syncing = true; setSync('busy');
  const sent = JSON.parse(JSON.stringify(S.pending));
  const metaSent = S.metaDirty ? S.metaUpdated : 0;
  const local = Object.fromEntries(S.tx.map(t=>[t.id,t]));
  const body = {key: S.sync.key, upserts: [], deletes: [], meta: S.metaDirty ? {cats:S.cats, budget:S.budget, subs:S.subs||[], updated:S.metaUpdated} : null};
  for (const [id,p] of Object.entries(sent)){
    if (p.op==='del') body.deletes.push({id, updated:p.updated});
    else if (local[id]) body.upserts.push({...local[id], updated: local[id].updated || p.updated, catName: findCat(local[id].type, local[id].cat).name});
  }
  const before = JSON.stringify([S.tx, S.cats, S.budget, S.subs]);
  try{
    const r = await fetch(S.sync.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'error');
    for (const [id,p] of Object.entries(sent)) if (S.pending[id] && S.pending[id].updated===p.updated) delete S.pending[id];
    if (metaSent && S.metaUpdated===metaSent) S.metaDirty = false;
    if (d.meta && !S.metaDirty && d.meta.updated > (S.metaUpdated||0)){ S.cats = d.meta.cats; S.budget = d.meta.budget; S.subs = d.meta.subs || []; S.metaUpdated = d.meta.updated; }
    else if (!d.meta && !S.metaDirty){ markMeta(); syncAgain = true; }
    const now = Object.fromEntries(S.tx.map(t=>[t.id,t]));
    let tx = d.tx.map(fixCat).map(t=>{ delete t.catName; return t; });
    for (const [id,p] of Object.entries(S.pending)){
      tx = tx.filter(t=>t.id!==id);
      if (p.op==='up' && now[id]) tx.push(now[id]);
    }
    S.tx = tx; S.lastSync = Date.now(); saveLocal(); setSync('ok');
    processSubs();
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#app') && document.activeElement.tagName==='INPUT';
    if ((manual || JSON.stringify([S.tx, S.cats, S.budget, S.subs]) !== before) && !typing) render();
    if (manual) toast('ซิงค์เรียบร้อย ☁️');
  }catch(e){
    setSync(navigator.onLine ? 'err' : 'offline');
    if (manual) toast(navigator.onLine ? 'ซิงค์ไม่ได้: ' + (e.message||'') : 'ไม่มีอินเทอร์เน็ต');
  }
  syncing = false;
  if (syncAgain){ syncAgain = false; setTimeout(sync, 300); }
}
async function linkSync(){
  const url = $('#surl').value.trim(), key = $('#skey').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/');
  if (!key) return toast('ใส่รหัสลับด้วยนะ');
  toast('กำลังเชื่อมต่อ...');
  try{
    const r = await fetch(url + (url.includes('?')?'&':'?') + 'key=' + encodeURIComponent(key));
    const d = await r.json();
    if (!d.ok) return toast(d.error || 'เชื่อมต่อไม่ได้');
    S.sync = {url, key};
    if (S.tx.length && d.tx.length && !confirm(`ในเครื่องนี้มี ${S.tx.length} รายการ และใน Sheets มี ${d.tx.length} รายการ จะรวมทั้งสองฝั่งเข้าด้วยกัน ตกลงไหม?`)) { S.sync={url:'',key:''}; return; }
    markAll();
    if (d.meta && !S.tx.length){ S.metaDirty = false; S.metaUpdated = 0; }
    saveLocal(); await sync(true); render();
  }catch(e){ toast('เชื่อมต่อไม่ได้ ตรวจลิงก์และการตั้งค่า "Anyone" อีกครั้ง'); }
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible'){ processSubs(); render(); sync(); } });
window.addEventListener('online', ()=>sync());
setInterval(()=>{ if (document.visibilityState==='visible') sync(); }, 60000);

/* ---------- บิลประจำ / ค่าสมาชิก ---------- */
const PRESETS = [['🎬','Netflix'],['🎵','Spotify'],['▶️','YouTube Premium'],['☁️','iCloud'],['📱','ค่าโทรศัพท์'],['🌐','เน็ตบ้าน'],['🤖','AI'],['🏋️','ฟิตเนส'],['🛡️','ประกัน'],['🎮','เกม']];
const CYCLE = {monthly:'รายเดือน', yearly:'รายปี', weekly:'รายสัปดาห์'};
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const daysTo = (a,b) => Math.round((pd(b)-pd(a))/864e5);
function occAt(sub,k){
  const a = pd(sub.anchor);
  if (sub.cycle==='weekly'){ const d=new Date(a); d.setDate(d.getDate()+7*k); return ymd(d); }
  const months = sub.cycle==='yearly' ? 12*k : k;
  const y = a.getFullYear(), m = a.getMonth()+months;
  const dim = new Date(y, m+1, 0).getDate();
  return ymd(new Date(y, m, Math.min(a.getDate(), dim)));
}
function occs(sub, from, to){
  const out=[]; for(let k=0;k<3000;k++){ const d=occAt(sub,k); if(d>to) break; if(d>=from) out.push(d); } return out;
}
function nextDue(sub){
  const t=todayStr(); for(let k=0;k<3000;k++){ const d=occAt(sub,k); if(d>=t) return d; } return t;
}
const perMonth = s => s.cycle==='yearly' ? s.amount/12 : s.cycle==='weekly' ? s.amount*52/12 : s.amount;
const activeSubs = () => (S.subs||[]).filter(s=>s.active!==false);
function dueText(n){ return n===0?'วันนี้':n===1?'พรุ่งนี้':`อีก ${n} วัน`; }
function dueSoon(){ return activeSubs().map(s=>({s,d:nextDue(s)})).map(o=>({...o,n:daysTo(todayStr(),o.d)})).filter(o=>o.n<=(o.s.remind??3)).sort((a,b)=>a.n-b.n); }
function ensureSubCat(){ if (!S.cats.expense.some(c=>c.id==='subs')){ S.cats.expense.splice(0,0,{id:'subs',icon:'🔁',name:'บิล/สมาชิก'}); markMeta(); } }
function processSubs(){
  const t = todayStr(); let changed=false;
  (S.subs||[]).forEach(s=>{
    if (s.active===false || !s.autoLog) return;
    let from = s.logged ? ymd(new Date(pd(s.logged).getTime()+864e5)) : (s.created && s.created>s.anchor ? s.created : s.anchor);
    const dates = occs(s, from, t);
    dates.forEach(d=>{
      const id = 's_'+s.id+'_'+d.replace(/-/g,'');
      if (!S.tx.some(x=>x.id===id)){
        S.tx.push({id, type:'expense', amount:s.amount, cat:s.cat||'subs', note:'🔁 '+s.name+(s.card?' · '+s.card:''), date:d, ts:Date.now(), updated:Date.now()});
        markTx(id,'up');
      }
    });
    if (dates.length){ s.logged = dates[dates.length-1]; changed=true; }
  });
  if (changed){ markMeta(); save(); }
}
function subBanner(){
  const list = dueSoon(); if (!list.length) return '';
  return `<div class="card" style="padding:12px 14px"><h3 style="margin-bottom:6px">🔔 ใกล้ถึงวันตัดเงิน</h3>${list.map(o=>`
    <button class="crow" data-tab="subs"><div class="ic" style="width:34px;height:34px;font-size:17px">${esc(o.s.icon)}</div>
    <div class="mid"><b style="font-weight:600">${esc(o.s.name)}</b><small style="display:block;color:var(--muted)">${o.s.card?esc(o.s.card)+' · ':''}${dayLabelFull(o.d)}</small></div>
    <div style="text-align:right"><b>${baht(o.s.amount)}</b><small style="display:block;color:${o.n<=1?'var(--exp)':'var(--warn)'};font-weight:600">${dueText(o.n)}</small></div></button>`).join('')}</div>`;
}
const dayLabelFull = s => pd(s).toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
function viewSubs(){
  const subs = (S.subs||[]).map(s=>({s,d:nextDue(s)})).sort((a,b)=>(a.s.active===false)-(b.s.active===false) || a.d.localeCompare(b.d));
  const act = activeSubs();
  const mon = act.reduce((a,s)=>a+perMonth(s),0);
  const y0 = todayStr().slice(0,4)+'-01-01';
  const paidYear = act.reduce((a,s)=>a + occs(s, s.anchor>y0?s.anchor:y0, todayStr()).length*s.amount, 0);
  return `
  <div class="top"><h1>บิลประจำ</h1><button class="btn" style="width:auto;padding:8px 14px;font-size:14px" data-act="addsub">+ เพิ่ม</button></div>
  <div class="stat3">
    <div><span class="small">ต่อเดือน</span><b class="exp">${fmt(Math.round(mon))}</b></div>
    <div><span class="small">ต่อปี</span><b class="exp">${fmt(Math.round(mon*12))}</b></div>
    <div><span class="small">จ่ายแล้วปีนี้</span><b>${fmt(Math.round(paidYear))}</b></div>
  </div>
  ${subs.length ? `<div class="list">${subs.map(({s,d})=>{ const n=daysTo(todayStr(),d), off=s.active===false; return `
    <button class="item" data-subedit="${s.id}" style="${off?'opacity:.5':''}"><div class="ic">${esc(s.icon)}</div>
    <div class="mid"><div>${esc(s.name)}</div><small>${CYCLE[s.cycle]}${s.card?' · '+esc(s.card):''}${s.autoLog?' · บันทึกอัตโนมัติ':''}</small>
      <small style="color:${off?'var(--muted)':n<=(s.remind??3)?'var(--exp)':'var(--muted)'};font-weight:${n<=(s.remind??3)&&!off?700:400}">${off?'หยุดชั่วคราว':`ตัดครั้งถัดไป ${dayLabelFull(d)} (${dueText(n)})`}</small></div>
    <div style="text-align:right"><div class="amt">${fmt(s.amount)}</div>${s.cycle!=='monthly'?`<small style="color:var(--muted)">≈${fmt(Math.round(perMonth(s)))}/ด.</small>`:''}</div></button>`}).join('')}</div>
    <div class="card" style="margin-top:12px"><h3>สัดส่วนค่าใช้จ่ายต่อปี</h3>${act.slice().sort((a,b)=>perMonth(b)-perMonth(a)).map((s,i,arr)=>`
      <div class="crow" style="cursor:default"><div class="mid"><div style="display:flex;justify-content:space-between"><span>${esc(s.icon)} ${esc(s.name)}</span><b>${fmt(Math.round(perMonth(s)*12))}</b></div>
      <div class="bar"><i style="width:${perMonth(s)/perMonth(arr[0])*100}%;background:${COLORS[i%COLORS.length]}"></i></div></div></div>`).join('')}</div>`
  : `<div class="empty"><div>🔁</div>ยังไม่มีบิลประจำ<br>กด "+ เพิ่ม" เพื่อเพิ่ม Netflix, ค่าโทรศัพท์ ฯลฯ</div>`}
  ${syncOn()?'':`<p class="small" style="text-align:center;margin-top:12px">เชื่อม Google Sheets แล้วตั้งค่าอีเมลแจ้งเตือนได้ (ดูในตั้งค่า)</p>`}`;
}
let subDraft = null;
function openSub(sub){
  ensureSubCat();
  subDraft = sub ? {...sub} : {id:null, icon:'🔁', name:'', amount:'', cycle:'monthly', anchor:todayStr(), remind:3, card:'', cat:'subs', autoLog:true, active:true};
  renderSubSheet(); $('#mask').classList.add('open');
}
function renderSubSheet(){
  const d = subDraft;
  $('#sheet').innerHTML = `<div class="grab"></div>
    <h3 style="text-align:center">${d.id?'แก้ไขบิลประจำ':'เพิ่มบิลประจำ'}</h3>
    ${d.id?'':`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${PRESETS.map(([i,n])=>`<button class="chip" style="margin:0;padding:6px 10px" data-preset="${esc(n)}" data-pi="${i}">${i} ${esc(n)}</button>`).join('')}</div>`}
    <div class="field"><input id="sicon" value="${esc(d.icon)}" maxlength="4" style="flex:0 0 60px;text-align:center;font-size:20px"><input id="sname" placeholder="ชื่อ เช่น Netflix" value="${esc(d.name)}" maxlength="30"></div>
    <div class="field"><input id="samt" inputmode="decimal" placeholder="ราคา (บาท)" value="${d.amount}"></div>
    <div class="seg">${Object.entries(CYCLE).map(([k,v])=>`<button class="${d.cycle===k?'on':''}" data-scycle="${k}">${v}</button>`).join('')}</div>
    <label class="small">วันตัดเงินครั้งถัดไป (หรือครั้งล่าสุด)</label>
    <div class="field" style="margin-top:4px"><input id="sdate" type="date" value="${d.anchor}"></div>
    <div class="field"><input id="scard" placeholder="ตัดจากบัตร/บัญชีไหน (ไม่ใส่ก็ได้)" value="${esc(d.card)}" maxlength="30"></div>
    <div class="field"><label class="small" style="align-self:center;flex:none">เตือนล่วงหน้า</label>
      <select id="sremind" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)">${[0,1,2,3,5,7].map(n=>`<option value="${n}" ${n==(d.remind??3)?'selected':''}>${n===0?'วันที่ตัด':n+' วัน'}</option>`).join('')}</select></div>
    <div class="field"><label class="small" style="align-self:center;flex:none">หมวด</label>
      <select id="scat" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)">${visibleCats('expense').map(c=>`<option value="${c.id}" ${c.id===d.cat?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></div>
    <label class="crow" style="cursor:pointer"><input type="checkbox" id="sauto" ${d.autoLog?'checked':''} style="width:20px;height:20px;accent-color:var(--brand)"><div class="mid"><b style="font-weight:600">บันทึกเป็นรายจ่ายอัตโนมัติ</b><small style="display:block;color:var(--muted)">ถึงวันตัดเงินแล้วแอพจะลงรายการให้เอง</small></div></label>
    ${d.id?`<label class="crow" style="cursor:pointer"><input type="checkbox" id="sactive" ${d.active!==false?'checked':''} style="width:20px;height:20px;accent-color:var(--brand)"><div class="mid"><b style="font-weight:600">ใช้งานอยู่</b><small style="display:block;color:var(--muted)">ปิดไว้ถ้ายกเลิก/พักสมาชิกชั่วคราว</small></div></label>`:''}
    <button class="btn" style="margin-top:12px" data-act="savesub">บันทึก</button>
    <div class="btns">${d.id?`<button class="btn danger" data-act="delsub">ลบ</button>`:''}<button class="btn ghost" data-act="close">ยกเลิก</button></div>`;
}
function syncSubDraft(){
  const d=subDraft; d.icon=$('#sicon').value.trim()||'🔁'; d.name=$('#sname').value.trim(); d.amount=$('#samt').value.trim();
  d.anchor=$('#sdate').value||todayStr(); d.card=$('#scard').value.trim(); d.remind=Number($('#sremind').value); d.cat=$('#scat').value;
  d.autoLog=$('#sauto').checked; if($('#sactive')) d.active=$('#sactive').checked;
}
function saveSub(){
  syncSubDraft(); const d=subDraft, amount=calc(d.amount);
  if (!d.name) return toast('ใส่ชื่อก่อนนะ');
  if (!(amount>0)) return toast('ใส่ราคาก่อนนะ');
  S.subs = S.subs || [];
  const old = d.id && S.subs.find(s=>s.id===d.id);
  const rec = {...d, amount, id: d.id || 'b'+Date.now().toString(36), created: d.created || todayStr()};
  if (old && (old.anchor!==rec.anchor || old.cycle!==rec.cycle)) { rec.logged = null; rec.created = todayStr(); }
  if (old) S.subs = S.subs.map(s=>s.id===rec.id?rec:s); else S.subs.push(rec);
  markMeta(); processSubs(); save(); closeSheet(); render(); toast('บันทึกแล้ว');
}

processSubs();
render();
sync();
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
